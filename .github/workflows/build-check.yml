name: Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --progress=false
      - name: Verify Cloudflare prebuild scripts
        run: node scripts/patchAppNavigation.cjs && node scripts/generateApAllotmentIndexes.cjs && node scripts/generateManifest.cjs && node scripts/patchRegionalHeader.cjs && node scripts/patchAllotmentUx.cjs && node scripts/brandPdfExports.cjs && node scripts/fixScholarshipPortalVisuals.cjs
      - name: Production build with captured log
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          cat build.log
          echo "$status" > build.status
          exit "$status"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manofstudy-build-diagnostics
          path: |
            build.log
            build.status
          if-no-files-found: warn
