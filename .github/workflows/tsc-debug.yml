name: Temporary TSC Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tsc-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply production source repairs before diagnostics
        run: |
          node scripts/fixAllotmentUxSyntax.cjs
          node scripts/fixTypeScriptIssues.cjs
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > tsc-output.txt 2>&1
          echo $? > tsc-exit-code.txt
          cat tsc-output.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-diagnostics-after-repair
          path: |
            tsc-output.txt
            tsc-exit-code.txt
