name: Temporary Dependency Audit Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture npm audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit-output.json 2>&1
          echo $? > audit-exit-code.txt
          cat audit-output.json
      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-diagnostics
          path: |
            audit-output.json
            audit-exit-code.txt
