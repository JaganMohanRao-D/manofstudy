name: Temporary Build Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture production build diagnostics
        shell: bash
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          echo $? > build-exit-code.txt
          cat build-output.txt
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-output.txt
            build-exit-code.txt
