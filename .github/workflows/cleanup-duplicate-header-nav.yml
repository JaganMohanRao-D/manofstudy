name: Cleanup duplicate header navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicate injected header navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/SiteUxFixes.tsx')
          text = path.read_text(encoding='utf-8')
          old = text
          text = text.replace('    addCompactHeaderNav();\n', '')
          if text == old:
              raise SystemExit('No duplicate header-nav calls found; refusing to create an unnecessary commit.')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit the cleanup and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-duplicate-header-nav.yml
          git add src/components/SiteUxFixes.tsx
          git commit -m "Remove duplicate header navigation"
          git push
