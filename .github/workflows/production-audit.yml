name: MOS Production Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mos-production-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript build scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.cjs; do
            node --check "$file"
          done
          if [ -f functions/index.js ]; then
            node --check functions/index.js
          fi

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
