name: MOS Production Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mos-production-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript build scripts
        shell: bash
        run: |
          set -euo pipefail
          # Apply the same deterministic source compatibility patches used by
          # the production prebuild before checking every build-time script.
          node scripts/fixAllotmentUxSyntax.cjs
          node scripts/fixTypeScriptIssues.cjs
          for file in scripts/*.cjs; do
            node --check "$file"
          done
          if [ -f functions/index.js ]; then
            node --check functions/index.js
          fi

      - name: Admin authentication and CMS unit tests
        run: node --test functions/adminAuthCore.test.js functions/adminCmsCore.test.js

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit-report.json
          audit_exit=$?
          set -e

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          const vulnerabilities = Object.entries(report.vulnerabilities || {});
          const blocking = vulnerabilities.filter(([, item]) =>
            (item.severity === 'high' || item.severity === 'critical') &&
            item.fixAvailable
          );
          const unfixable = vulnerabilities.filter(([, item]) =>
            (item.severity === 'high' || item.severity === 'critical') &&
            !item.fixAvailable
          );

          if (blocking.length) {
            console.error('Blocking high/critical dependency vulnerabilities with an available remediation:');
            for (const [name, item] of blocking) {
              console.error(`- ${name}: ${item.severity} (fix available)`);
            }
            process.exit(1);
          }

          if (unfixable.length) {
            console.warn('High/critical vulnerabilities with no npm remediation are present; these are reported but do not block the production audit:');
            for (const [name, item] of unfixable) {
              console.warn(`- ${name}: ${item.severity} (no fix available)`);
            }
          }

          if (!vulnerabilities.length) {
            console.log('Dependency audit: no vulnerabilities reported.');
          }
          NODE

          if [ "$audit_exit" -ne 0 ]; then
            echo "npm audit reported issues; the workflow blocks high/critical issues only when npm reports an available remediation."
          fi
