    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mos_theme') || localStorage.getItem('javisak_theme') || localStorage.getItem('studymacha_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      /* Cover the transient SEO prerender while the interactive React app mounts. */
      #app-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5f7fb;
        color: #172033;
        opacity: 1;
        visibility: visible;
        transition: opacity 180ms ease, visibility 180ms ease;
      }
      html.dark #app-boot-screen {
        background: #060b16;
        color: #f8fafc;
      }
      html.app-ready #app-boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-boot-screen .app-boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }
      #app-boot-screen img {
        display: block;
        width: min(184px, 54vw);
        height: auto;
        object-fit: contain;
      }
      #app-boot-screen .app-boot-spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(16, 185, 129, .2);
        border-top-color: #059669;
        border-radius: 50%;
        animation: app-boot-spin .8s linear infinite;
      }
      #app-boot-screen .app-boot-error p {
        max-width: 28rem;
      }
      #app-boot-screen .app-boot-error .app-boot-help {
        font-weight: 400;
      }
      #app-boot-retry {
        margin-top: 4px;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        background: #047857;
        color: #fff;
        font: 700 13px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #app-boot-retry:hover { background: #065f46; }
      #app-boot-retry:focus-visible {
        outline: 3px solid #6ee7b7;
        outline-offset: 3px;
      }
      #app-boot-screen p {
        margin: 0;
        font: 600 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #526071;
      }
      html.dark #app-boot-screen p { color: #cbd5e1; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-screen { transition: none; }
        #app-boot-screen .app-boot-spinner { animation-duration: 2.4s; }
      }
    </style>
    <script>
      /*
       * A timeout must not uncover an empty #root. If React has not mounted
       * after 12 seconds, keep the user informed and offer an explicit retry.
       */
      window.setTimeout(function () {
        var html = document.documentElement;
        if (html.classList.contains('app-ready')) return;

        var screen = document.getElementById('app-boot-screen');
        if (!screen) return;

        screen.classList.add('app-boot-failed');
        screen.innerHTML =
          '<div class="app-boot-inner app-boot-error">' +
            '<img src="/Naa%20College%20logo.webp" alt="Naa College" width="184" height="80" />' +
            '<p role="alert">Naa College is taking longer than expected to start.</p>' +
            '<p class="app-boot-help">Check your connection, then reload the page.</p>' +
            '<button type="button" id="app-boot-retry">Reload Naa College</button>' +
          '</div>';

        var retryButton = document.getElementById('app-boot-retry');
        if (retryButton) {
          retryButton.addEventListener('click', function () {
            window.location.reload();
          });
        }
      }, 12000);
    </script>
