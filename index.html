    <script>
      (function() {
        var root = document.documentElement;
        var migrationKey = 'naa_college_theme_migrated_v1';
        try {
          var migrated = localStorage.getItem(migrationKey) === '1';
          var saved = localStorage.getItem('mos_theme') || localStorage.getItem('javisak_theme') || localStorage.getItem('studymacha_theme');
          // Prior versions forced "dark" into storage every visit. Use light on
          // first load after this update; retain only preferences saved after migration.
          var theme = migrated && (saved === 'light' || saved === 'dark') ? saved : 'light';
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
        } catch (e) {
          root.classList.remove('dark');
          root.classList.add('light');
          root.setAttribute('data-theme', 'light');
          root.style.colorScheme = 'light';
        }
      })();
    </script>
